<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090817">
  <meta name="description" content="Một lời chúc 20/10 dành riêng cho Vân Anh, từ anh.">
  <title>Gửi Vân Anh — 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Lời chúc ngày Phụ nữ Việt Nam 20 tháng 10">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="memory-photos" id="memoryPhotos" aria-hidden="true"></div>
    <header class="topline" aria-label="Thiệp gửi Vân Anh, ngày 20 tháng 10">
      <span class="topline-mark" aria-hidden="true">✦</span>
      <span>GỬI RIÊNG VÂN ANH</span>
      <span class="topline-date">20 THÁNG 10</span>
    </header>
    <section class="message" aria-label="Lời chúc dành cho Vân Anh">
      <p class="eyebrow" id="eyebrow"></p>
      <article class="letter-card" id="letterCard" aria-label="Bức thư chúc mừng 20 tháng 10">
        <h1 id="messageTitle" aria-live="polite"></h1>
        <p class="message-body" id="messageBody"></p>
        <p class="signoff" id="signoff"></p>
        <button class="continue-letter" id="continueLetter" type="button" hidden>Nhấn để tiếp tục <span aria-hidden="true">→</span></button>
      </article>
    </section>
    <button class="envelope" id="envelope" type="button" aria-label="Nhấn để mở thư">
      <span class="envelope-back"></span><span class="envelope-paper"></span>
      <span class="envelope-flap"></span><span class="envelope-heart">♥</span>
      <span class="envelope-caption">Gửi Vân Anh <span>·</span> nhấn để mở</span>
    </button>
    <p class="hint" id="hint"><span class="hint-dot" aria-hidden="true"></span><span id="hintText">Chạm vào màn hình để tạo sóng sáng</span></p>
    <nav class="controls" id="controls" aria-label="Điều khiển thiệp">
      <button class="control-button replay" id="replayButton" type="button" aria-label="Phát lại từ đầu">
        <span aria-hidden="true">↻</span><span class="replay-label">Phát lại</span>
      </button>
      <p class="scene-counter" aria-live="polite"><span id="counter">01</span><i aria-hidden="true">/</i><span id="totalScenes">12</span></p>
      <button class="control-button next" id="nextButton" type="button" aria-label="Chuyển cảnh tiếp theo">Tiếp <span aria-hidden="true">→</span></button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
