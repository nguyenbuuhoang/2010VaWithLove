<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090817">
  <meta name="description" content="Một lời chúc 20/10 dành riêng cho Vân Anh, từ anh.">
  <title>Gửi Vân Anh — 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Lời chúc ngày Phụ nữ Việt Nam 20 tháng 10">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section class="message" aria-live="polite" aria-atomic="true">
      <p class="eyebrow" id="eyebrow"></p>
      <article class="letter-card" id="letterCard" aria-label="Bức thư chúc mừng 20 tháng 10">
        <div class="letter-top">20 · 10 <span>♡</span></div>
        <h1 id="messageTitle"></h1>
        <p class="message-body" id="messageBody"></p>
        <p class="signoff" id="signoff"></p>
      </article>
    </section>
    <button class="envelope" id="envelope" type="button" aria-label="Nhấn để mở thư">
      <span class="envelope-back"></span><span class="envelope-paper"></span>
      <span class="envelope-flap"></span><span class="envelope-heart">♥</span>
      <span class="envelope-caption">Gửi Vân Anh <span>·</span> nhấn để mở</span>
    </button>
  </main>
  <script src="script.js"></script>
</body>
</html>
